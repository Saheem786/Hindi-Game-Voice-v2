name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
          contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create minimal Android project files
        run: |
          mkdir -p app/src/main/java/com/hindigamevoice/v2

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Hindi-Game-Voice-v2"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRclass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.hindigamevoice.v2"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.hindigamevoice.v2"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:label="Hindi Game Voice v2"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/hindigamevoice/v2/MainActivity.kt
          package com.hindigamevoice.v2

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import java.util.Locale

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private var tts: TextToSpeech? = null
              private var pitch = 1.0f
              private var speed = 1.0f

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  tts = TextToSpeech(this, this)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 32, 32, 32)
                  }

                  val titleText = TextView(this).apply {
                      text = "Hindi Game Voice v2"
                      textSize = 22f
                  }
                  layout.addView(titleText)

                  val pitchLabel = TextView(this).apply {
                      text = "Pitch adjustment"
                  }
                  layout.addView(pitchLabel)

                  val pitchSeekBar = SeekBar(this).apply {
                      max = 20
                      progress = 10
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              pitch = progress / 10.0f
                              tts?.setPitch(pitch)
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })
                  }
                  layout.addView(pitchSeekBar)

                  val speedLabel = TextView(this).apply {
                      text = "Speech Rate adjustment"
                  }
                  layout.addView(speedLabel)

                  val speedSeekBar = SeekBar(this).apply {
                      max = 20
                      progress = 10
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              speed = progress / 10.0f
                              tts?.setSpeechRate(speed)
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })
                  }
                  layout.addView(speedSeekBar)

                  val speakButton = Button(this).apply {
                      text = "Speak Hindi Voice"
                      setOnClickListener {
                          tts?.speak("नमस्ते, हिंदी गेम वॉयस में आपका स्वागत है!", TextToSpeech.QUEUE_FLUSH, null, "HindiTTS")
                      }
                  }
                  layout.addView(speakButton)

                  val overlayButton = Button(this).apply {
                      text = "Setup Overlay Permission"
                      setOnClickListener {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this@MainActivity)) {
                              val intent = Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")
                              )
                              startActivity(intent)
                          } else {
                              Toast.makeText(this@MainActivity, "Overlay permission granted", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
                  layout.addView(overlayButton)

                  setContentView(layout)
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      val result = tts?.setLanguage(Locale("hi", "IN"))
                      if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                          Toast.makeText(this, "Hindi language not supported", Toast.LENGTH_SHORT).show()
                      }
                  } else {
                      Toast.makeText(this, "TextToSpeech initialization failed", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
      tag_name: v1.0.0
      name: Release v1.0.0
      files: app/build/outputs/apk/debug/app-debug.apk
