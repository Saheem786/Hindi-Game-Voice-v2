name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create minimal Android project files
      run: |
        mkdir -p app/src/main/java/com/hindigamevoice/v2

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Hindi Game Voice v2"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.hindigamevoice.v2"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.hindigamevoice.v2"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "2.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="Hindi Game Voice v2"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/hindigamevoice/v2/MainActivity.kt
        package com.hindigamevoice.v2

        import android.content.Intent
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.Settings
        import android.speech.tts.TextToSpeech
        import android.widget.Button
        import android.widget.LinearLayout
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import java.util.Locale

        class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {
            private var tts: TextToSpeech? = null

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                tts = TextToSpeech(this, this)

                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(50, 50, 50, 50)
                }

                val overlayButton = Button(this).apply {
                    text = "Enable Floating Voice Control"
                    setOnClickListener {
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this@MainActivity)) {
                            val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                            startActivity(intent)
                        } else {
                            Toast.makeText(this@MainActivity, "Voice control service active", Toast.LENGTH_SHORT).show()
                        }
                    }
                }
                layout.addView(overlayButton)

                setContentView(layout)
            }

            override fun onInit(status: Int) {
                if (status == TextToSpeech.SUCCESS) {
                    val result = tts?.setLanguage(Locale("hi", "IN"))
                    if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                        Toast.makeText(this, "Hindi language not supported", Toast.LENGTH_SHORT).show()
                    }
                } else {
                    Toast.makeText(this, "TextToSpeech initialization failed", Toast.LENGTH_SHORT).show()
                }
            }

            override fun onDestroy() {
                tts?.stop()
                tts?.shutdown()
                super.onDestroy()
            }
        }
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK
      run: gradle assembleDebug

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.0
        name: Release v2.0.0
        files: app/build/outputs/apk/debug/app-debug.apk
